{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu thành công — {{ COMPANY_NAME }}{% endblock %}
{% block content %}

<div class="min-h-screen flex items-center justify-center px-4 pt-24 pb-16
            bg-white dark:bg-slate-950">
  <div class="w-full max-w-md text-center">

    <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center
                mx-auto mb-5 shadow-lg shadow-emerald-950/30">
      <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <h1 class="font-display text-3xl font-bold uppercase tracking-tight
               text-slate-900 dark:text-white mb-3">
      Mật khẩu đã được đặt lại!
    </h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed mb-8 max-w-sm mx-auto">
      Mật khẩu của bạn đã được cập nhật thành công. Hãy đăng nhập bằng mật khẩu mới.
    </p>

    <a href="{% url 'customers:login' %}" class="btn-primary text-sm">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0
                 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
      </svg>
      Đăng nhập ngay
    </a>
  </div>
</div>

{% endblock %}
